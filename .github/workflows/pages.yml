name: Publish personal website
on:
  push:
    branches: [main]
    paths: [source-manifest.json, scripts/mirror_site.py, .github/workflows/pages.yml]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and retain the complete website
        run: python scripts/mirror_site.py --retain
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: mirror
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy the verified copy
        id: deployment
        uses: actions/deploy-pages@v5
